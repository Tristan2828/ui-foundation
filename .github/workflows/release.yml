name: release

# On every push to main that changes the package, the template or
# create-app.sh: *stage* @tristan2828/ui-foundation on npm, then tag the
# commit vX.Y.Z and create a GitHub release. One version names both: apps
# install the package at X.Y.Z, and create-app.sh copies template/ from tag
# vX.Y.Z.
#
# Staged, not published: the version goes live only when the developer
# approves it on npmjs.com (or `npm stage approve`) with their passkey, so a
# compromised workflow or dependency can't push a release to every app on
# its own. The trusted-publisher entry deliberately does not allow plain
# `npm publish`. After approving, run the `release-smoke` workflow for the
# tag to create an app from the live release.
#
# The version: the next patch after the latest tag — unless
# packages/ui-foundation/package.json says something higher, which is how a
# minor or major release is made (bump it there in the PR). Nothing is
# committed back; the staged package.json carries the computed version.
#
# npm authenticates by trusted publishing (OIDC, no stored token) — a
# one-time setup, in docs/ARCHITECTURE.md "Releasing".

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        name: Does this push need a release, and which version?
        run: |
          latest=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          if [ -n "$latest" ]; then
            paths=$(git diff --name-only "$latest" HEAD -- packages/ui-foundation template scripts/create-app.sh)
            if [ -z "$paths" ]; then
              echo "Nothing released changed since $latest — no release."
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Changed since $latest:"
            echo "$paths"
          fi
          committed=$(node -p "require('./packages/ui-foundation/package.json').version")
          version=$(LATEST="${latest#v}" COMMITTED="$committed" node -e '
            const parse = (v) => v.split(".").map(Number)
            const cmp = (a, b) => { for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0 }
            const committed = parse(process.env.COMMITTED)
            if (!process.env.LATEST) { console.log(process.env.COMMITTED); process.exit(0) }
            const next = parse(process.env.LATEST); next[2]++
            console.log((cmp(committed, next) > 0 ? committed : next).join("."))
          ')
          echo "Next version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.decide.outputs.version != ''
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - id: stage
        name: Build and stage on npm
        if: steps.decide.outputs.version != ''
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          # Staged publishing needs npm 11.15.0 or later.
          npm install -g npm@11.20.0
          npm ci
          if npm view "@tristan2828/ui-foundation@$VERSION" version >/dev/null 2>&1; then
            # A re-run, or a version published by hand (3.0.0 was).
            echo "$VERSION is already live on npm — nothing to stage."
            echo "status=live" >> "$GITHUB_OUTPUT"
          else
            npm version "$VERSION" -w @tristan2828/ui-foundation --no-git-tag-version --allow-same-version
            npm stage publish -w @tristan2828/ui-foundation --access public
            echo "status=staged" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and release
        if: steps.decide.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.decide.outputs.version }}
          VERSION: ${{ steps.decide.outputs.version }}
          STATUS: ${{ steps.stage.outputs.status }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          if [ "$STATUS" = "staged" ]; then
            pending="**Staged on npm, waiting for approval.** Until it's approved, \`npm install\` of $VERSION fails. Approve it on npmjs.com (the package → Staged Packages) or with \`npm stage list @tristan2828/ui-foundation\` then \`npm stage approve <stage-id>\`; then run the \`release-smoke\` workflow for $TAG."
          else
            pending=""
          fi
          gh release create "$TAG" --title "$TAG" --notes "$(cat <<EOF
          $pending

          Upgrade an app: \`npm install @tristan2828/ui-foundation@$VERSION && npx ui-foundation sync\`, then \`npm run verify\`.

          New app: \`bash create-app.sh <name> $TAG\` (docs/create-an-app.md).
          EOF
          )"
