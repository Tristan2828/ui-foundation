name: release

# On every push to main that changes the package, the template or
# create-app.sh: publish @tristan2828/ui-foundation to npm, tag the commit
# vX.Y.Z with a GitHub release, then create an app from the live release and
# verify it (release-smoke). One version names both halves: apps install the
# package at X.Y.Z, and create-app.sh copies template/ from tag vX.Y.Z. No
# step needs a person.
#
# npm authenticates by trusted publishing: a short-lived OIDC token that only
# this workflow, on this repo, can mint. No npm token is stored anywhere.
# Because nothing reviews a version before it goes live, the job that can
# publish runs no third-party code: `build` installs dependencies and packs
# the tarball with no publish permission, and `publish` gets id-token: write
# but no checkout and no `npm ci`, only `npm publish <tarball>`. Third-party
# actions are pinned to commit SHAs. What stands between a change and every
# app is the PR gate (verify, install-test), which branch protection on main
# requires (docs/ARCHITECTURE.md "Releasing").
#
# The version: the next patch after the latest tag, unless
# packages/ui-foundation/package.json says something higher, which is how a
# minor or major release is made (bump it there in the PR). Nothing is
# committed back; the published package.json carries the computed version.

on:
  push:
    branches: [main]

permissions: {}

# Releases in merge order, never two at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - id: decide
        name: Does this push need a release, and which version?
        run: |
          latest=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          if [ -n "$latest" ]; then
            paths=$(git diff --name-only "$latest" HEAD -- packages/ui-foundation template scripts/create-app.sh)
            if [ -z "$paths" ]; then
              echo "Nothing released changed since $latest — no release."
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Changed since $latest:"
            echo "$paths"
          fi
          committed=$(node -p "require('./packages/ui-foundation/package.json').version")
          version=$(LATEST="${latest#v}" COMMITTED="$committed" node -e '
            const parse = (v) => v.split(".").map(Number)
            const cmp = (a, b) => { for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0 }
            const committed = parse(process.env.COMMITTED)
            if (!process.env.LATEST) { console.log(process.env.COMMITTED); process.exit(0) }
            const next = parse(process.env.LATEST); next[2]++
            console.log((cmp(committed, next) > 0 ? committed : next).join("."))
          ')
          echo "Next version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: decide
    if: needs.decide.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Build and pack the package at the release version
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          npm ci
          npm version "$VERSION" -w @tristan2828/ui-foundation --no-git-tag-version --allow-same-version
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack -w @tristan2828/ui-foundation --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [decide, build]
    runs-on: ubuntu-latest
    # The only job that can publish. No checkout, no npm ci: nothing from the
    # repo or its dependency tree runs here.
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-tarball
          path: pack
      - name: Publish to npm (trusted publishing, with provenance)
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          # Trusted publishing needs npm 11.5.1 or later; Node 22 ships 10.x.
          npm install -g npm@11.20.0
          if npm view "@tristan2828/ui-foundation@$VERSION" version >/dev/null 2>&1; then
            # A re-run, or a version published by hand (3.0.0 was).
            echo "$VERSION is already live on npm; nothing to publish."
          else
            npm publish pack/*.tgz --access public --provenance
          fi

  tag:
    needs: [decide, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the commit and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.decide.outputs.version }}
          VERSION: ${{ needs.decide.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # --target creates the tag at this commit, so no checkout is needed.
          # release-smoke replaces the first paragraph with its result.
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$(cat <<EOF
          **Published to npm; [release-smoke]($RUN_URL) is checking it.** Wait for its result here before upgrading an app.

          Upgrade an app: \`npm install @tristan2828/ui-foundation@$VERSION && npx ui-foundation sync\`, then \`npm run verify\`.

          New app: \`bash create-app.sh <name> $TAG\` (docs/create-an-app.md).
          EOF
          )"

  smoke:
    needs: [decide, tag]
    permissions:
      contents: write
    uses: ./.github/workflows/release-smoke.yml
    with:
      tag: v${{ needs.decide.outputs.version }}
