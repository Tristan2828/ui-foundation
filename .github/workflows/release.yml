name: release

# On a push to main that bumps the version in
# packages/ui-foundation/package.json past the latest tag: publish
# @tristan2828/ui-foundation to npm and
# ui-foundation-backend to PyPI, tag the commit vX.Y.Z with a GitHub release,
# then create an app from the live release and verify it (release-smoke).
# One version names every part: apps install both packages at X.Y.Z, and
# create-app.sh copies template/ from tag vX.Y.Z. No step needs a person.
#
# npm and PyPI both authenticate by trusted publishing: a short-lived OIDC
# token that only this workflow, on this repo, can mint. No npm or PyPI
# token is stored anywhere. Because nothing reviews a version before it
# goes live, the jobs that can publish run no checkout and nothing from the
# repo or its dependency trees: `build` and `build-py` install dependencies
# and build with no publish permission; `publish` gets id-token: write and
# runs only `npm publish <tarball>`, and `publish-py` only the PyPA publish
# action on the files `build-py` made. Third-party actions are pinned to
# commit SHAs. What stands between a change and every
# app is the PR gate (verify, install-test), which branch protection on main
# requires (docs/ARCHITECTURE.md "Releasing").
#
# The version (#231): the one in packages/ui-foundation/package.json. A PR
# that finishes a feature, or a fix an app needs now, bumps it (a patch, a
# minor or a major), and its merge releases everything merged since the
# last tag as that one version, with one CHANGELOG entry. A push with no
# bump releases nothing; its changes go out with the next bump. Run by
# hand (workflow_dispatch) it releases main as it is, at the bumped
# version or, when nobody bumped it, the next patch after the latest tag:
# for a forgotten bump. Nothing is committed back; the published
# package.json carries the decided version.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Releases in merge order, never two at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - id: decide
        name: Does this push need a release, and which version?
        env:
          EVENT: ${{ github.event_name }}
        run: |
          latest=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          committed=$(node -p "require('./packages/ui-foundation/package.json').version")
          if [ -n "$latest" ]; then
            paths=$(git diff --name-only "$latest" HEAD -- packages/ui-foundation packages/backend-foundation template scripts/create-app.sh)
            if [ -z "$paths" ]; then
              echo "Nothing released changed since $latest — no release."
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Changed since $latest:"
            echo "$paths"
          fi
          # bumped: package.json's version is past the latest tag. next: the
          # version to release, package.json's when bumped, else the next
          # patch (used only when run by hand).
          read -r bumped version < <(LATEST="${latest#v}" COMMITTED="$committed" node -e '
            const parse = (v) => v.split(".").map(Number)
            const cmp = (a, b) => { for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0 }
            const committed = parse(process.env.COMMITTED)
            if (!process.env.LATEST) { console.log("true", process.env.COMMITTED); process.exit(0) }
            const latest = parse(process.env.LATEST)
            if (cmp(committed, latest) > 0) { console.log("true", committed.join(".")); process.exit(0) }
            latest[2]++
            console.log("false", latest.join("."))
          ')
          if [ "$bumped" != "true" ] && [ "$EVENT" != "workflow_dispatch" ]; then
            echo "packages/ui-foundation/package.json is at $committed, not past $latest — no release. These changes go out with the next PR that bumps it (or run this workflow by hand)."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Next version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: decide
    if: needs.decide.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Build and pack the package at the release version
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          npm ci
          npm version "$VERSION" -w @tristan2828/ui-foundation --no-git-tag-version --allow-same-version
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack -w @tristan2828/ui-foundation --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [decide, build]
    runs-on: ubuntu-latest
    # The only job that can publish. No checkout, no npm ci: nothing from the
    # repo or its dependency tree runs here.
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-tarball
          path: pack
      - name: Publish to npm (trusted publishing, with provenance)
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          # Trusted publishing needs npm 11.5.1 or later; Node 22 ships 10.x.
          npm install -g npm@11.20.0
          if npm view "@tristan2828/ui-foundation@$VERSION" version >/dev/null 2>&1; then
            # Already live. Fine on a re-run of this commit (publish worked
            # and a later job failed). Not from another commit: that happens
            # when `tag` failed after a publish, so the next push computes
            # the same version. Tagging it would pair that commit's template
            # with this version's package, and its package changes would
            # never publish. The provenance names the commit the live
            # version was built from (no need for a reproducible tarball).
            built_from=$(curl -fsS "https://registry.npmjs.org/-/npm/v1/attestations/@tristan2828%2fui-foundation@$VERSION" | node -e '
              let body = ""
              process.stdin.on("data", (d) => (body += d)).on("end", () => {
                for (const { predicateType, bundle } of JSON.parse(body).attestations) {
                  if (predicateType !== "https://slsa.dev/provenance/v1") continue
                  const statement = JSON.parse(Buffer.from(bundle.dsseEnvelope.payload, "base64").toString())
                  console.log(statement.predicate.buildDefinition.resolvedDependencies[0].digest.gitCommit)
                }
              })' 2>/dev/null || true)
            if [ "$built_from" != "$GITHUB_SHA" ]; then
              echo "::error::$VERSION is already on npm, built from ${built_from:-an unknown commit (no provenance)}, not $GITHUB_SHA. Tag that commit by hand (gh release create v$VERSION --target <commit>), then re-run all jobs here so this commit releases as the next patch."
              exit 1
            fi
            echo "$VERSION is already live on npm, built from this commit (a re-run); nothing to publish."
          else
            # The ./ matters: npm reads `pack/x.tgz` as a GitHub user/repo
            # shorthand and tries to git-clone it.
            npm publish ./pack/*.tgz --access public --provenance
          fi

  build-py:
    needs: decide
    if: needs.decide.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build ui-foundation-backend at the release version
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          # As for the npm package: the committed version is a floor, the
          # published one is the decided version, and nothing is committed back.
          toml=packages/backend-foundation/pyproject.toml
          sed -i "s/^version = \".*\"$/version = \"$VERSION\"/" "$toml"
          grep -qx "version = \"$VERSION\"" "$toml" || { echo "::error::couldn't write $VERSION into $toml"; exit 1; }
          python -m pip install build==1.6.1
          python -m build packages/backend-foundation --outdir "$RUNNER_TEMP/dist"
          ls -l "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 7

  publish-py:
    needs: [decide, build-py]
    runs-on: ubuntu-latest
    # The only job that can publish to PyPI. No checkout, no pip install:
    # nothing from the repo or its dependency tree runs here.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: dist
      - name: Already on PyPI? Only if built from this commit
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        shell: python3 {0}
        run: |
          # The rule `publish` applies on npm: a version already live is a
          # re-run of this commit (publish worked, a later job failed), or it
          # was built from another commit, which happens when `tag` failed
          # after a publish, and tagging would pair this commit's template
          # with another commit's package. PyPI keeps each file's provenance
          # (PEP 740), whose Sigstore certificate names the commit the
          # publishing workflow ran on. Stdlib only.
          import base64, json, os, sys, urllib.error, urllib.request

          name, version, sha = "ui-foundation-backend", os.environ["VERSION"], os.environ["GITHUB_SHA"]


          def get(url):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise


          release = get(f"https://pypi.org/pypi/{name}/{version}/json")
          if release is None:
              print(f"{version} isn't on PyPI yet; publishing.")
              sys.exit(0)
          for file in release["urls"]:
              provenance = get(f"https://pypi.org/integrity/{name}/{version}/{file['filename']}/provenance") or {}
              certificates = [
                  base64.b64decode(attestation["verification_material"]["certificate"])
                  for bundle in provenance.get("attestation_bundles", [])
                  for attestation in bundle.get("attestations", [])
              ]
              if not any(sha.encode() in certificate for certificate in certificates):
                  print(
                      f"::error::{version} is already on PyPI and {file['filename']} wasn't built from {sha} "
                      "(or has no provenance). Tag the commit it was built from by hand "
                      f"(gh release create v{version} --target <commit>), then re-run all jobs here so this "
                      "commit releases as the next patch."
                  )
                  sys.exit(1)
          print(f"{version} is already on PyPI, built from this commit (a re-run); only missing files upload.")
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          # On a re-run of this commit (checked above), a file already
          # uploaded is skipped rather than refused.
          skip-existing: true

  tag:
    needs: [decide, publish, publish-py]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the commit and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.decide.outputs.version }}
          VERSION: ${{ needs.decide.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # --target creates the tag at this commit, so no checkout is needed.
          # release-smoke replaces the first paragraph with its result.
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$(cat <<EOF
          **Published to npm and PyPI; [release-smoke]($RUN_URL) is checking it.** Wait for its result here before upgrading an app.

          Upgrade an app: \`npm install @tristan2828/ui-foundation@$VERSION && npx ui-foundation sync\`, then \`npm run verify\`. Its backend: \`ui-foundation-backend==$VERSION\` in \`backend/pyproject.toml\`, then \`npm run verify:backend\` (docs/consuming.md).

          New app: \`bash create-app.sh <name> $TAG\` (docs/create-an-app.md).
          EOF
          )"

  smoke:
    needs: [decide, tag]
    permissions:
      contents: write
    uses: ./.github/workflows/release-smoke.yml
    with:
      tag: v${{ needs.decide.outputs.version }}
