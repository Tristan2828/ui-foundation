name: tmp-call-verify

# TEMPORARY, removed before this PR merges: calls verify.yml the way
# release.yml does (workflow_call, full: true), on PRs into the CI branch
# only, so the reusable path runs once before it reaches main.
on:
  pull_request:
    branches: [claude/ui-foundation-ci-perf-8dc046]

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/verify.yml
    with:
      full: true
