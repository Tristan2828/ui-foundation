name: release-watch

# Everything after the passkey approval, done for the developer. release.yml
# stages a version on npm and marks its GitHub release "waiting for
# approval"; approval happens on npmjs.com, which can't notify GitHub. So
# this polls: when the oldest release still marked waiting is live on npm,
# it runs release-smoke against it, rewrites the release notes with the
# result and closes the "Approve ..." issue release.yml opened.
#
# A failed smoke test marks the release failed rather than waiting, so the
# next poll doesn't retry it every half hour. Fix the cause, then re-run
# release-smoke by hand for that tag.
#
# Approval itself stays manual on purpose: it's the passkey step that keeps
# a compromised workflow or dependency from shipping to every app
# (docs/ARCHITECTURE.md "Releasing").

on:
  schedule:
    - cron: "*/30 * * * *"
  # Right after approving, to skip the wait: gh workflow run release-watch.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Never two smoke tests of the same release at once.
concurrency:
  group: release-watch
  cancel-in-progress: false

env:
  WAITING: "Staged on npm, waiting for approval"

jobs:
  find:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - id: find
        name: The oldest release approved since it was staged
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for tag in $(gh release list --limit 20 --json tagName --jq 'reverse | .[].tagName'); do
            gh release view "$tag" --json body --jq .body | grep -q "$WAITING" || continue
            if npm view "@tristan2828/ui-foundation@${tag#v}" version >/dev/null 2>&1; then
              echo "$tag was approved and is live on npm."
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$tag is still waiting for approval."
          done
          echo "Nothing newly live."

  smoke:
    needs: find
    if: needs.find.outputs.tag != ''
    uses: ./.github/workflows/release-smoke.yml
    with:
      tag: ${{ needs.find.outputs.tag }}

  record:
    needs: [find, smoke]
    if: always() && needs.find.outputs.tag != '' && needs.smoke.result != 'skipped' && needs.smoke.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Update the release notes and close the approval issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.find.outputs.tag }}
          RESULT: ${{ needs.smoke.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          version="${TAG#v}"
          if [ "$RESULT" = "success" ]; then
            status="**Live on npm.** [release-smoke]($RUN_URL) created an app from this release and its \`verify\` passed."
            comment="Approved and live. [release-smoke]($RUN_URL) passed, so apps can take $version."
          else
            status="**Live on npm, but [release-smoke]($RUN_URL) failed.** An app created from this release doesn't pass \`verify\`. Hold upgrades until it's fixed; after a fix, re-run release-smoke for $TAG by hand."
            comment="Approved and live, but [release-smoke]($RUN_URL) failed. Apps shouldn't take $version until that's fixed."
          fi
          # Replace the "waiting" paragraph, keep the rest of the notes.
          gh release view "$TAG" --json body --jq .body |
            STATUS="$status" awk -v waiting="$WAITING" 'index($0, waiting) { print ENVIRON["STATUS"]; next } { print }' \
            > notes.md
          gh release edit "$TAG" --notes-file notes.md

          title="Approve @tristan2828/ui-foundation $version on npm"
          for issue in $(gh issue list --state open --search "in:title \"$title\"" --json number,title \
                           --jq ".[] | select(.title == \"$title\") | .number"); do
            if [ "$RESULT" = "success" ]; then
              gh issue close "$issue" --reason completed --comment "$comment"
            else
              gh issue comment "$issue" --body "$comment"
            fi
          done
          [ "$RESULT" = "success" ] || { echo "$comment"; exit 1; }
