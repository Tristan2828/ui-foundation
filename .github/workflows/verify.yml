name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # The package's gate (codegen, types, lint, deps, build, unit tests,
    # Storybook accessibility and token checks), then the template's (the
    # same checks an app runs, plus every Playwright screen test) against
    # the package as built.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: |
            template/test-results/
            packages/ui-foundation/test-results/
          retention-days: 7

  verify-backend:
    # The reference backend's gate: mypy, pytest (SQLite) and a diff of
    # FastAPI's generated OpenAPI document against template/openapi.yaml.
    # Then the migrations against a real Postgres and the COMMENT ON check
    # (scripts/check_db_comments.py), which SQLite can't run. The full
    # Postgres-backed run (live server, real-mode Playwright) is
    # template/scripts/check-backend-postgres.sh, run locally for backend
    # changes (it needs Docker).
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image and credentials as template/docker-compose.yml.
        image: postgres:18
        env:
          POSTGRES_USER: ui_foundation
          POSTGRES_PASSWORD: ui_foundation
          POSTGRES_DB: ui_foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ui_foundation"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: template/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: template/backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: bash scripts/verify.sh
      - name: Migrations and COMMENT ON check against Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://ui_foundation:ui_foundation@localhost:5432/ui_foundation
          DATABASE_SSL: "false"
        run: |
          python -m alembic upgrade head
          python scripts/check_db_comments.py
