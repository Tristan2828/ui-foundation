# NEGATIVE CONTROL ONLY, never merged.
name: verify
'on':
  pull_request: null
  workflow_call:
    inputs:
      full:
        description: Run everything even when only docs changed (release.yml sets it for a release).
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  HARNESS_SHARDED: --project=chromium
  HARNESS_PHONE: --project=phone
  HARNESS_PERF: --project=perf --no-deps
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - run: 'true'
  harness:
    name: harness ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
        - 3
        - 4
    steps:
    - run: '[ "${{ strategy.job-index }}" != 1 ]'
  harness-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - run: 'true'
  verify:
    needs:
    - checks
    - harness
    - harness-perf
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Every part passed
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: "echo \"$NEEDS\" | jq -r 'to_entries[] | \"\\(.key): \\(.value.result)\"'\nif ! echo \"$NEEDS\" | jq -e '[.[].result] | length > 0 and all(. == \"success\")' > /dev/null; then\n  echo \"::error::Not\
        \ every part of verify passed.\"\n  exit 1\nfi\n"
  verify-backend:
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
