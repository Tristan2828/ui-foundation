name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # The package's gate (codegen, types, lint, deps, build, unit tests,
    # Storybook accessibility and token checks), then the template's (the
    # same checks an app runs, plus every Playwright screen test) against
    # the package as built.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: |
            template/test-results/
            packages/ui-foundation/test-results/
          retention-days: 7

  verify-backend:
    # The reference backend's gate: mypy, pytest (SQLite) and a diff of
    # FastAPI's generated OpenAPI document against template/openapi.yaml.
    # The Postgres-backed run is template/scripts/check-backend-postgres.sh,
    # run locally for backend changes (it needs Docker).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: template/backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: bash scripts/verify.sh
