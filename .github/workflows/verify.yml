name: verify

on:
  push:
    branches: [main]
  pull_request:

# Reads the repo and nothing else; release.yml is the only workflow that
# writes or publishes.
permissions:
  contents: read

jobs:
  verify:
    # The package's gate (codegen, types, lint, deps, build, unit tests,
    # Storybook accessibility and token checks), then the template's (the
    # same checks an app runs, plus every Playwright screen test) against
    # the package as built.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-test-results
          path: |
            template/test-results/
            packages/ui-foundation/test-results/
          retention-days: 7

  verify-backend:
    # The backend package's gate (packages/backend-foundation: mypy, pytest),
    # then the reference backend's: mypy, pytest (SQLite) and a diff of
    # FastAPI's generated OpenAPI document against template/openapi.yaml.
    # Then the migrations against a real Postgres and the COMMENT ON check
    # (scripts/check_db_comments.py), which SQLite can't run. The full
    # Postgres-backed run (live server, real-mode Playwright) is
    # template/scripts/check-backend-postgres.sh, run locally for backend
    # changes (it needs Docker).
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image and credentials as template/docker-compose.yml.
        image: postgres:18
        env:
          POSTGRES_USER: ui_foundation
          POSTGRES_PASSWORD: ui_foundation
          POSTGRES_DB: ui_foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ui_foundation"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: template/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            packages/backend-foundation/pyproject.toml
            template/backend/pyproject.toml
      # Both editable in one pip call: the template depends on
      # ui-foundation-backend unpinned, and only this way does it resolve to
      # this commit's packages/backend-foundation rather than PyPI.
      - run: pip install -e ../../packages/backend-foundation -e ".[dev]"
      - run: bash ../../packages/backend-foundation/scripts/verify.sh
      - run: bash scripts/verify.sh
      - name: Migrations and COMMENT ON check against Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://ui_foundation:ui_foundation@localhost:5432/ui_foundation
          DATABASE_SSL: "false"
        run: |
          python -m alembic upgrade head
          python scripts/check_db_comments.py
