name: release-smoke

# Creates an app from a live release — the template at the tag, the package
# from npm, its backend's ui-foundation-backend from PyPI — and runs that
# app's full verify and its backend's. Everything before a release
# tests a tarball; this is the one check of exactly what apps get. Then it
# writes the result at the top of the GitHub release's notes.
#
# Runs automatically as release.yml's last job. By hand, e.g. to re-check a
# release after a fix elsewhere:
#   gh workflow run release-smoke.yml -f tag=v3.0.1
#
# A failure fails the run (GitHub emails the repo owner) and marks the
# release notes, so nobody upgrades an app onto it unawares.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (vX.Y.Z), already live on npm"
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions: {}

jobs:
  create-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: The version is live on npm
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # Right after publishing, the registry can take a moment to serve
          # it, and the version's listing comes before its tarball: 3.17.0,
          # 3.18.0 and 3.20.0 each failed here with `npm view` answering and
          # the install's tarball GET still a 404. So wait for the tarball.
          for attempt in $(seq 1 20); do
            url=$(npm view "@tristan2828/ui-foundation@${TAG#v}" dist.tarball 2>/dev/null || true)
            if [ -n "$url" ] && curl -fsSL -o /dev/null "$url"; then
              echo "${TAG#v} is live: $url"
              exit 0
            fi
            echo "Not downloadable from npm yet (attempt $attempt); retrying in 30s."
            sleep 30
          done
          echo "${TAG#v} isn't live on npm."
          exit 1
      - name: Create an app from the release and verify it
        env:
          TAG: ${{ inputs.tag }}
          GIT_AUTHOR_NAME: release-smoke
          GIT_AUTHOR_EMAIL: release-smoke@localhost
          GIT_COMMITTER_NAME: release-smoke
          GIT_COMMITTER_EMAIL: release-smoke@localhost
        run: |
          cd "$RUNNER_TEMP"
          bash "$GITHUB_WORKSPACE/scripts/create-app.sh" release-smoke "$TAG"
          cd release-smoke
          npx playwright install --with-deps chromium
          npm run verify
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Its backend, with ui-foundation-backend from PyPI
        env:
          TAG: ${{ inputs.tag }}
        run: |
          cd "$RUNNER_TEMP/release-smoke/backend"
          if ! grep -q '"ui-foundation-backend==' pyproject.toml; then
            echo "This release's backend doesn't use ui-foundation-backend (before 4.25.0); not checked here."
            exit 0
          fi
          # As on npm, a new version can take a moment to be installable.
          for attempt in $(seq 1 20); do
            if python -m pip download --no-cache-dir --no-deps -q -d "$RUNNER_TEMP/pypi-check" "ui-foundation-backend==${TAG#v}"; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "ui-foundation-backend ${TAG#v} isn't installable from PyPI."
              exit 1
            fi
            echo "Not installable from PyPI yet (attempt $attempt); retrying in 30s."
            sleep 30
          done
          python -m pip install -e ".[dev]"
          bash scripts/verify.sh

  record:
    needs: create-app
    if: always() && needs.create-app.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write the result into the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          RESULT: ${{ needs.create-app.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RESULT" = "success" ]; then
            status="**Live on npm and PyPI, and [release-smoke]($RUN_URL) passed:** an app created from this release passes \`verify\` and its backend's."
          else
            status="**Live on npm and PyPI, but [release-smoke]($RUN_URL) failed:** an app created from this release doesn't pass \`verify\`. Don't upgrade apps onto it; the fix ships as the next patch."
          fi
          # Replace an earlier status paragraph (this workflow's, release.yml's,
          # or a pre-3.1 "staged" one), keep the rest of the notes.
          {
            echo "$status"
            gh release view "$TAG" --json body --jq .body |
              grep -v -E '^\*\*(Published to npm|Live on npm|Staged on npm)'
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
