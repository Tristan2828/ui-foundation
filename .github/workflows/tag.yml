name: tag

# Cuts a release tag automatically when a merge to main changes anything
# registry.json ships. Replaces the hand routine of tag → re-run
# consume-test against the tag → bump the tag in the README, which was
# three manual steps that taxed every registry-shipped change.
#
# What makes dropping the manual re-run safe: the registry workflow already
# install-tested this exact tree on the PR, and a tag on the merge commit
# points at that same tree. Testing the tag afterwards re-tested content
# that had not changed.
#
# The README no longer hardcodes a version (it links the latest release),
# so nothing has to be committed back to main — this workflow only pushes
# a tag and creates a release, which branch protection does not block.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        name: Did this merge change anything the registry ships?
        run: |
          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$latest" ]; then
            echo "No tags yet — nothing to compare against; skipping."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          paths=$(node scripts/registry-paths-changed.mjs "$latest" HEAD)
          if [ -z "$paths" ]; then
            echo "No registry-shipped path changed since $latest — no tag."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Registry-shipped paths changed since $latest:"
          echo "$paths"

          # Patch bump. A minor or major release is still a deliberate act:
          # push that tag by hand and this workflow will carry on from it,
          # because the next bump is computed from `git describe`, not from
          # a version committed in a file.
          version=${latest#v}
          major=${version%%.*}
          rest=${version#*.}
          minor=${rest%%.*}
          patch=${rest#*.}
          next="v${major}.${minor}.$((patch + 1))"
          echo "Next tag: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        if: steps.decide.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Registry release. Install: \`npx shadcn@4.21.0 add Tristan2828/ui-foundation/starter#$TAG\`"
