name: setup-frontend
description: >-
  Node 22, `npm ci` (whose postinstall builds the package, as every app
  imports it), and Playwright's Chromium with its system packages, the
  packages from the cache when they can be (with-apt-cache).

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: npm
    - shell: bash
      run: npm ci
    - uses: ./.github/actions/with-apt-cache
      with:
        run: npx playwright install --with-deps chromium
