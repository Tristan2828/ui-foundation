# The local database: what `backend/scripts/dev.sh` uses by default and
# scripts/check-backend-postgres.sh always uses. The backend itself runs on the host
# (`uvicorn app.main:app --reload` from backend/, after `alembic upgrade
# head`), not in a container. For a real database, point DATABASE_URL at a
# hosted one (docs/cloud-postgres.md) or a self-hosted one
# (docs/home-lab-postgres.md) instead.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ui_foundation
      POSTGRES_PASSWORD: ui_foundation
      POSTGRES_DB: ui_foundation
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ images expect a single mount at /var/lib/postgresql
      # (not .../data) — the image manages a major-version-specific
      # subdirectory itself now, for pg_upgrade --link compatibility.
      # Mounting at .../data (the pre-18 convention) makes the image
      # refuse to start ("PostgreSQL data in ... (unused mount/volume)").
      - ui-foundation-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ui_foundation"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  ui-foundation-postgres:
