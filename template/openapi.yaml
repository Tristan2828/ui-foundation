openapi: 3.1.0
info:
  title: UI Foundation Demo API — Widgets
  version: "1.0.0"
  description: >
    The app's API contract. Owned by the app, not by any backend: change it
    deliberately, then run `npm run gen:api` — the mock-conformance tests
    and the backend's spec-conformance check both fail until mocks and
    backend match it.

    /auth/* and the error bodies (ValidationErrorBody, HTTPErrorBody and the
    four error responses) are the foundation's part of the contract: the
    @tristan2828/ui-foundation package calls exactly these shapes, and
    `ui-foundation check-contract` fails verify if they drift. Everything
    else is this app's.

    Wire pagination deliberately does not match the UI's Page<T> (offset/limit
    and {items,total} here, {items,total,page,pageSize} in the UI), so the
    gateway's translation is a real seam, not a passthrough. Validation
    errors follow FastAPI's default shape ({"detail": [...]}), other errors
    FastAPI's HTTPException body ({"detail": string}). Every path except
    /auth/login and /auth/register requires a session (401 otherwise). A
    duplicate email on register is a 422 field error, not a 409.

servers:
  - url: /api

paths:
  /auth/login:
    post:
      operationId: login
      summary: Log in with email and password, receiving a session cookie
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated. Sets the session_id cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /auth/register:
    post:
      operationId: register
      summary: Create an account and immediately log in, receiving a session cookie
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200":
          description: Registered and authenticated. Sets the session_id cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /auth/logout:
    post:
      operationId: logout
      summary: Clear the current session
      tags: [auth]
      responses:
        "204":
          description: Logged out (always, whether or not a session existed).
        "500": { $ref: "#/components/responses/ServerError" }

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: The currently authenticated user
      tags: [auth]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /categories:
    get:
      operationId: listCategories
      summary: Search categories for the widget-form combobox
      tags: [categories]
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Case-insensitive substring match on name.
        - name: ids
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: integer }
            maxItems: 100
          description: >
            Only these categories, e.g. "ids=1&ids=3" — how a form or table
            gets the names of references it already holds, whether or not
            they match the current search. Unknown ids are left out.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Matching categories, unpaginated (typeahead result set, not a table).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /widgets:
    get:
      operationId: listWidgets
      summary: List widgets — server-side pagination, sorting, filtering
      tags: [widgets]
      parameters:
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          schema:
            type: string
            pattern: "^(name|status|availableFrom|price|checklistState):(asc|desc)$"
          description: 'Single sort field and direction, e.g. "name:asc".'
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/WidgetStatus" }
        - name: categoryId
          in: query
          schema: { type: integer }
        - name: search
          in: query
          schema: { type: string }
          description: Case-insensitive substring match on name.
        - name: tags
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/WidgetTag" }
          description: >
            Widgets with any of these tags. Repeat the parameter once per
            tag, e.g. "tags=fragile&tags=seasonal".
        - name: checklistState
          in: query
          schema: { $ref: "#/components/schemas/WidgetChecklistState" }
          description: Only widgets whose computed checklistState matches.
        - name: inStock
          in: query
          schema: { type: boolean }
          description: >
            Only widgets whose inStock matches, sent as "inStock=true" or
            "inStock=false". Absent means either.
        - name: extraCategoryIds
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: integer }
          description: >
            Widgets linked to any of these categories through
            extraCategoryIds. Repeat the parameter once per id, e.g.
            "extraCategoryIds=1&extraCategoryIds=3".
      responses:
        "200":
          description: A page of widgets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WidgetListResponse" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      operationId: createWidget
      summary: Create a widget
      tags: [widgets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WidgetCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Widget" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /widgets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getWidget
      summary: Get a single widget
      tags: [widgets]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Widget" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      operationId: updateWidget
      summary: Partially update a widget
      tags: [widgets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WidgetUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Widget" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      operationId: deleteWidget
      summary: Delete a widget
      tags: [widgets]
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "500": { $ref: "#/components/responses/ServerError" }

components:
  schemas:
    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: integer, readOnly: true }
        email: { type: string, format: email }
        name: { type: string, minLength: 1, maxLength: 200 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    RegisterRequest:
      type: object
      required: [email, name, password]
      properties:
        email: { $ref: "#/components/schemas/User/properties/email" }
        name: { $ref: "#/components/schemas/User/properties/name" }
        password: { $ref: "#/components/schemas/LoginRequest/properties/password" }

    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 100 }

    WidgetStatus:
      type: string
      enum: [draft, active, archived]
      description: Enum field — forces Select input + badge rendering (Phase 4).

    WidgetTag:
      type: string
      enum: [fragile, bulky, seasonal, featured]
      description: One option of the multi-choice tags field.

    Widget:
      type: object
      description: >
        One property per field type the foundation supports, so each maps
        unambiguously to the UI pattern it exercises and /new-entity has a
        reference to copy (docs/entities/widget.md). Six came from Phase 4;
        tags (multi choice) was added in Phase G because a real project
        needed it; inStock (yes/no) in 3.4.0, extraCategoryIds (multi
        reference) in 3.5.0, checklist (sub-records) in 3.6.0 and
        checklistState (computed) in 3.7.0 for the Task Dashboard app. Add a type only when a real app needs one.
      required:
        - id
        - name
        - categoryId
        - status
        - availableFrom
        - price
        - description
        - tags
        - inStock
        - extraCategoryIds
        - checklist
        - checklistState
      properties:
        id: { type: integer, readOnly: true }
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Display label. Not one of the six forcing field types.
        categoryId:
          type: integer
          description: >
            Foreign key to Category.id — forces a combobox with async search
            (Phase 4). Required: every widget belongs to a category.
        status:
          allOf: [{ $ref: "#/components/schemas/WidgetStatus" }]
          default: draft
        availableFrom:
          type: string
          format: date-time
          description: >
            Datetime field — forces a date picker plus timezone handling
            (Phase 4). ISO 8601 with offset, e.g. "2026-09-15T00:00:00Z".
        assigneeEmail:
          type: ["string", "null"]
          format: email
          description: >
            Nullable field — forces empty-state display when null and
            optional (not required-when-present) validation (Phase 4).
        price:
          type: string
          pattern: "^\\d+\\.\\d{2}$"
          description: >
            Decimal field, represented as a fixed-2-decimal-place string
            (never a float) to avoid binary rounding on money — forces
            locale-aware formatting on display and parsing on input
            (Phase 4). Example: "19.99".
        description:
          type: string
          maxLength: 2000
          description: >
            Long-text field — forces a textarea on the form and truncation
            in the table (Phase 4).
        tags:
          type: array
          items: { $ref: "#/components/schemas/WidgetTag" }
          uniqueItems: true
          description: >
            Multi-choice field — forces a multi-select combobox with chips on
            the form, badges in the table, and an any-of list filter
            (Phase G). Always present on read; empty when none are chosen.
        inStock:
          type: boolean
          default: true
          description: >
            Yes/no field — forces a switch on the form, a Yes/No cell in the
            table and an either/yes/no list filter. Never null: always
            present on read, true when a create leaves it out.
        extraCategoryIds:
          type: array
          items: { type: integer }
          uniqueItems: true
          description: >
            Multi-reference field — links to any number of Category records
            by id. Forces a multi-select combobox with async search and
            chips on the form (names fetched with GET /categories?ids=...),
            names as badges in the table, and an any-of list filter.
            Always present on read, in ascending id order; empty when none.
            An id that isn't a category is a 422 field error.
        checklist:
          type: array
          items: { $ref: "#/components/schemas/ChecklistItem" }
          maxItems: 50
          description: >
            Sub-records — an ordered list of items that belong to this
            widget alone, edited on its form and saved with it. Forces a
            list editor (add, remove, move up/down) on the form and a
            done-count in the table. Always present on read, in the order
            saved; empty when none. A field error inside an item is keyed
            by its path, e.g. loc ["body", "checklist", 2, "text"].
        checklistState:
          allOf: [{ $ref: "#/components/schemas/WidgetChecklistState" }]
          readOnly: true
          description: >
            Computed, read-only field — worked out by the server from other
            data on every read, never stored and never sent by a client
            (absent from WidgetCreate/WidgetUpdate). Forces a read-only
            badge column, a filter and a sort that the server evaluates, so
            they hold across pages.

    WidgetCreate:
      type: object
      description: >
        Widget without a server-assigned id. tags, extraCategoryIds and
        checklist default to [], inStock to true.
      required: [name, categoryId, status, availableFrom, price, description]
      properties:
        name: { $ref: "#/components/schemas/Widget/properties/name" }
        categoryId: { $ref: "#/components/schemas/Widget/properties/categoryId" }
        status: { $ref: "#/components/schemas/WidgetStatus" }
        availableFrom: { $ref: "#/components/schemas/Widget/properties/availableFrom" }
        assigneeEmail: { $ref: "#/components/schemas/Widget/properties/assigneeEmail" }
        price: { $ref: "#/components/schemas/Widget/properties/price" }
        description: { $ref: "#/components/schemas/Widget/properties/description" }
        tags: { $ref: "#/components/schemas/Widget/properties/tags" }
        inStock: { $ref: "#/components/schemas/Widget/properties/inStock" }
        extraCategoryIds: { $ref: "#/components/schemas/Widget/properties/extraCategoryIds" }
        checklist: { $ref: "#/components/schemas/Widget/properties/checklist" }

    WidgetUpdate:
      type: object
      description: >
        All fields optional — PATCH semantics. tags, when sent, replaces the
        whole set (send [] to clear it); so do extraCategoryIds and
        checklist (which also keeps the order sent).
      properties:
        name: { $ref: "#/components/schemas/Widget/properties/name" }
        categoryId: { $ref: "#/components/schemas/Widget/properties/categoryId" }
        status: { $ref: "#/components/schemas/WidgetStatus" }
        availableFrom: { $ref: "#/components/schemas/Widget/properties/availableFrom" }
        assigneeEmail: { $ref: "#/components/schemas/Widget/properties/assigneeEmail" }
        price: { $ref: "#/components/schemas/Widget/properties/price" }
        description: { $ref: "#/components/schemas/Widget/properties/description" }
        tags: { $ref: "#/components/schemas/Widget/properties/tags" }
        inStock: { $ref: "#/components/schemas/Widget/properties/inStock" }
        extraCategoryIds: { $ref: "#/components/schemas/Widget/properties/extraCategoryIds" }
        checklist: { $ref: "#/components/schemas/Widget/properties/checklist" }

    WidgetChecklistState:
      type: string
      enum: [none, open, complete]
      description: >
        none: the checklist is empty. open: at least one item isn't done.
        complete: every item is done. Sorts in this order.

    ChecklistItem:
      type: object
      description: >
        One item of a widget's checklist. No id of its own: the list is
        read and written whole, in order.
      required: [text, done]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 300
          description: What to do. Surrounding spaces are trimmed; blank is a 422.
        done:
          type: boolean
          description: Ticked off.

    WidgetListResponse:
      type: object
      description: >
        Wire pagination shape — deliberately not Page<T>. The gateway
        computes page/pageSize from offset/limit; see src/api/gateway/.
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Widget" }
        total:
          type: integer
          minimum: 0

    ValidationErrorBody:
      type: object
      description: FastAPI's default 422 shape (RequestValidationError).
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            required: [loc, msg, type]
            properties:
              loc:
                type: array
                items:
                  type: ["string", "integer"]
              msg: { type: string }
              type: { type: string }

    HTTPErrorBody:
      type: object
      description: FastAPI's default HTTPException shape.
      required: [detail]
      properties:
        detail: { type: string }

  responses:
    ValidationError:
      description: Validation failed on one or more fields.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationErrorBody" }
    NotFoundError:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HTTPErrorBody" }
    UnauthorizedError:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HTTPErrorBody" }
    ServerError:
      description: Unhandled server error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HTTPErrorBody" }
