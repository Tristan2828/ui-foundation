openapi: 3.1.0
info:
  title: UI Foundation Demo API — Widgets
  version: "1.0.0"
  description: >
    The app's API contract. Owned by the app, not by any backend: change it
    deliberately, then run `npm run gen:api` — the mock-conformance tests
    and the backend's spec-conformance check both fail until mocks and
    backend match it.

    /auth/*, /environment and the error bodies (ValidationErrorBody,
    HTTPErrorBody and the four error responses) are the foundation's part
    of the contract: the @tristan2828/ui-foundation package calls exactly
    these shapes, and `ui-foundation check-contract` fails verify if they
    drift. Everything else is this app's.

    Wire pagination deliberately does not match the UI's Page<T> (offset/limit
    and {items,total} here, {items,total,page,pageSize} in the UI), so the
    gateway's translation is a real seam, not a passthrough. Validation
    errors follow FastAPI's default shape ({"detail": [...]}), other errors
    FastAPI's HTTPException body ({"detail": string}). Every path except
    /auth/login, /auth/register and /environment requires a session (401
    otherwise). A duplicate email on register is a 422 field error, not a
    409.

servers:
  - url: /api

paths:
  /auth/login:
    post:
      operationId: login
      summary: Log in with email and password, receiving a session cookie
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated. Sets the session_id cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "202":
          description: >
            The password is right and the account has a second step. No
            session yet: sets a short-lived, single-use pending_login cookie
            for POST /auth/login/totp.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginNextStep" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimitedError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /auth/login/totp:
    x-optional: true
    post:
      operationId: loginTotp
      summary: The second step of a sign-in, a code from an authenticator app or a recovery code
      description: >
        Needs the pending_login cookie a 202 from POST /auth/login set. A
        right code starts the session as a 200 from /auth/login does.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpLoginRequest" }
      responses:
        "200":
          description: Authenticated. Sets the session_id cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "410": { $ref: "#/components/responses/SignInExpiredError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimitedError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /auth/register:
    post:
      operationId: register
      summary: Create an account and immediately log in, receiving a session cookie
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200":
          description: Registered and authenticated. Sets the session_id cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /auth/logout:
    post:
      operationId: logout
      summary: Clear the current session
      tags: [auth]
      responses:
        "204":
          description: Logged out (always, whether or not a session existed).
        "500": { $ref: "#/components/responses/ServerError" }

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: The currently authenticated user
      tags: [auth]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /environment:
    x-optional: true
    get:
      operationId: getDataEnvironment
      summary: Which data the backend is serving, for DataEnvironmentBanner
      description: >
        Needs no session: the banner shows on /login too. A null dataLabel
        means production data, and no banner. The backend's DATA_LABEL.
      tags: [environment]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvironment" }
        "500": { $ref: "#/components/responses/ServerError" }

  /widget-categories:
    get:
      operationId: listWidgetCategories
      summary: Search widget categories for the widget-form combobox
      tags: [widget-categories]
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Case-insensitive substring match on name.
        - name: ids
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: integer }
            maxItems: 100
          description: >
            Only these categories, e.g. "ids=1&ids=3" — how a form or table
            gets the names of references it already holds, whether or not
            they match the current search. Unknown ids are left out.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Matching categories, unpaginated (typeahead result set, not a table).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WidgetCategory" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /widgets:
    get:
      operationId: listWidgets
      summary: List widgets — server-side pagination, sorting, filtering
      tags: [widgets]
      parameters:
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          schema:
            type: string
            pattern: "^(name|status|availableFrom|price|checklistState):(asc|desc)$"
          description: 'Single sort field and direction, e.g. "name:asc".'
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/WidgetStatus" }
        - name: categoryId
          in: query
          schema: { type: integer }
        - name: search
          in: query
          schema: { type: string }
          description: Case-insensitive substring match on name.
        - name: tags
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/WidgetTag" }
          description: >
            Widgets with any of these tags. Repeat the parameter once per
            tag, e.g. "tags=fragile&tags=seasonal".
        - name: checklistState
          in: query
          schema: { $ref: "#/components/schemas/WidgetChecklistState" }
          description: Only widgets whose computed checklistState matches.
        - name: inStock
          in: query
          schema: { type: boolean }
          description: >
            Only widgets whose inStock matches, sent as "inStock=true" or
            "inStock=false". Absent means either.
        - name: extraCategoryIds
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: integer }
          description: >
            Widgets linked to any of these categories through
            extraCategoryIds. Repeat the parameter once per id, e.g.
            "extraCategoryIds=1&extraCategoryIds=3".
        - name: deleted
          in: query
          schema: { type: boolean, default: false }
          description: >
            Absent or false lists live widgets. "deleted=true" lists only the
            deleted ones, to find one to restore.
      responses:
        "200":
          description: A page of widgets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WidgetListResponse" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      operationId: createWidget
      summary: Create a widget
      tags: [widgets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WidgetCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Widget" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /widgets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getWidget
      summary: Get a single widget
      tags: [widgets]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Widget" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      operationId: updateWidget
      summary: Partially update a widget
      tags: [widgets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WidgetUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Widget" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      operationId: deleteWidget
      summary: Delete a widget
      description: >
        Soft: the widget is marked deleted, not erased. It leaves the list
        and every other call (a second delete, a get or an update is a 404)
        until restoreWidget brings it back.
      tags: [widgets]
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /widgets/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: restoreWidget
      summary: Restore a deleted widget
      description: >
        Undoes deleteWidget. Only a deleted widget can be restored: a live
        or missing one is a 404.
      tags: [widgets]
      responses:
        "200":
          description: Restored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Widget" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /client-errors:
    x-optional: true
    post:
      operationId: reportClientError
      summary: A failure in the browser, for the backend to forward to error reporting
      description: >
        Sent by the package when an app turns on FoundationProviders'
        errorReporting. Needs a session, so the public can't post into it.
        The backend may drop a report (a duplicate, too many) and still
        answer 204. The user is the session's; the report never carries
        request or response bodies, cookies, headers, form values or
        query strings.
      tags: [errors]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientErrorReport" }
      responses:
        "204":
          description: Received (forwarded, or dropped as a duplicate).
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /push/public-key:
    x-optional: true
    get:
      operationId: getPushPublicKey
      summary: The app's VAPID public key, which a browser subscribes to push with
      description: >
        For usePushPermission. 404 when the backend has push turned off.
      tags: [push]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushPublicKey" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /push/subscriptions:
    x-optional: true
    post:
      operationId: savePushSubscription
      summary: Save this device's push subscription for the signed-in user
      description: >
        The browser's PushSubscription.toJSON(). The same endpoint again
        replaces its keys and owner and answers the same id. The endpoint
        must be a push service's (422 otherwise): the backend POSTs to it.
      tags: [push]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushSubscriptionRequest" }
      responses:
        "201":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushSubscriptionCreated" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /push/subscriptions/{id}:
    x-optional: true
    delete:
      operationId: deletePushSubscription
      summary: Stop sending to one of the signed-in user's devices
      tags: [push]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /jobs:
    get:
      operationId: listJobs
      summary: The scheduled jobs, each with its schedule and last run
      description: >
        The jobs registered in the backend (foundation_backend.jobs), in registration
        order. lastRun is the latest run that ran (ok or failed); runs a
        process skipped are left out.
      tags: [jobs]
      responses:
        "200":
          description: Every registered job.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /jobs/{name}/run:
    post:
      operationId: runJob
      summary: Run a scheduled job now
      description: >
        Starts a run in the background and answers at once, with the job
        running. GET /jobs shows the run once it ends. 409 while the job is
        already running, in this process or another.
      tags: [jobs]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "500": { $ref: "#/components/responses/ServerError" }

components:
  schemas:
    DataEnvironment:
      type: object
      required: [dataLabel]
      properties:
        dataLabel:
          type: ["string", "null"]
          minLength: 1
          description: >
            What the data is, as the banner names it ("dev" shows "Dev
            data"). null when the backend serves production data.

    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: integer, readOnly: true }
        email: { type: string, format: email }
        name: { type: string, minLength: 1, maxLength: 200 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 1024 }

    LoginNextStep:
      type: object
      required: [next]
      properties:
        next:
          type: string
          enum: [totp]
          description: The step the sign-in still needs.

    TotpLoginRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: The 6-digit code from the authenticator app, or a recovery code.

    RegisterRequest:
      type: object
      required: [email, name, password]
      properties:
        email: { $ref: "#/components/schemas/User/properties/email" }
        name: { $ref: "#/components/schemas/User/properties/name" }
        password: { $ref: "#/components/schemas/LoginRequest/properties/password" }

    WidgetCategory:
      description: >
        The widget's reference entity: what categoryId and extraCategoryIds
        point at. Named for the widget, so an app's own Category entity
        never collides with the demo's.
      type: object
      required: [id, name]
      properties:
        id: { type: integer, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 100 }

    WidgetStatus:
      type: string
      enum: [draft, active, archived]
      description: Enum field — forces Select input + badge rendering (Phase 4).

    WidgetTag:
      type: string
      enum: [fragile, bulky, seasonal, featured]
      description: One option of the multi-choice tags field.

    Widget:
      type: object
      description: >
        One property per field type the foundation supports, so each maps
        unambiguously to the UI pattern it exercises and /new-entity has a
        reference to copy (docs/entities/widget.md). Six came from Phase 4;
        tags (multi choice) was added in Phase G because a real project
        needed it; inStock (yes/no) in 3.4.0, extraCategoryIds (multi
        reference) in 3.5.0, checklist (sub-records) in 3.6.0 and
        checklistState (computed) in 3.7.0 for the Task Dashboard app. Add a type only when a real app needs one.
      required:
        - id
        - name
        - categoryId
        - status
        - availableFrom
        - price
        - description
        - tags
        - inStock
        - extraCategoryIds
        - checklist
        - pairings
        - checklistState
      properties:
        id: { type: integer, readOnly: true }
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Display label. Not one of the six forcing field types.
        categoryId:
          type: integer
          description: >
            Foreign key to WidgetCategory.id — forces a combobox with async search
            (Phase 4). Required: every widget belongs to a category.
        status:
          allOf: [{ $ref: "#/components/schemas/WidgetStatus" }]
          default: draft
        availableFrom:
          type: string
          format: date-time
          description: >
            Datetime field — forces a date picker plus timezone handling
            (Phase 4). ISO 8601 with offset, e.g. "2026-09-15T00:00:00Z".
        assigneeEmail:
          type: ["string", "null"]
          format: email
          description: >
            Nullable field — forces empty-state display when null and
            optional (not required-when-present) validation (Phase 4).
        price:
          type: string
          pattern: "^\\d+\\.\\d{2}$"
          description: >
            Decimal field, represented as a fixed-2-decimal-place string
            (never a float) to avoid binary rounding on money — forces
            locale-aware formatting on display and parsing on input
            (Phase 4). Example: "19.99".
        description:
          type: string
          maxLength: 2000
          description: >
            Long-text field — forces a textarea on the form and truncation
            in the table (Phase 4).
        tags:
          type: array
          items: { $ref: "#/components/schemas/WidgetTag" }
          uniqueItems: true
          description: >
            Multi-choice field — forces a multi-select combobox with chips on
            the form, badges in the table, and an any-of list filter
            (Phase G). Always present on read; empty when none are chosen.
        inStock:
          type: boolean
          default: true
          description: >
            Yes/no field — forces a switch on the form, a Yes/No cell in the
            table and an either/yes/no list filter. Never null: always
            present on read, true when a create leaves it out.
        extraCategoryIds:
          type: array
          items: { type: integer }
          uniqueItems: true
          description: >
            Multi-reference field — links to any number of WidgetCategory records
            by id. Forces a multi-select combobox with async search and
            chips on the form (names fetched with GET /widget-categories?ids=...),
            names as badges in the table, and an any-of list filter.
            Always present on read, in ascending id order; empty when none.
            An id that isn't a category is a 422 field error.
        checklist:
          type: array
          items: { $ref: "#/components/schemas/ChecklistItem" }
          maxItems: 50
          description: >
            Sub-records — an ordered list of items that belong to this
            widget alone, edited on its form and saved with it. Forces a
            list editor (add, remove, move up/down) on the form and a
            done-count in the table. Always present on read, in the order
            saved; empty when none. A field error inside an item is keyed
            by its path, e.g. loc ["body", "checklist", 2, "text"].
        pairings:
          type: array
          items: { $ref: "#/components/schemas/WidgetPairing" }
          maxItems: 20
          description: >
            Sub-records whose items hold a reference — an ordered list of
            the categories this widget pairs with, each with a note. Read
            and written whole, in order, like checklist. An item carries the
            referenced id only (categoryId); names come from the lookup by
            id, GET /widget-categories?ids=..., as for any reference. Always
            present on read; empty when none. An id that isn't a category is
            a 422 at the item's path, e.g. loc ["body", "pairings", 2,
            "categoryId"].
        checklistState:
          allOf: [{ $ref: "#/components/schemas/WidgetChecklistState" }]
          readOnly: true
          description: >
            Computed, read-only field — worked out by the server from other
            data on every read, never stored and never sent by a client
            (absent from WidgetCreate/WidgetUpdate). Forces a read-only
            badge column, a filter and a sort that the server evaluates, so
            they hold across pages.

    WidgetCreate:
      type: object
      description: >
        Widget without a server-assigned id. tags, extraCategoryIds,
        checklist and pairings default to [], inStock to true.
      required: [name, categoryId, status, availableFrom, price, description]
      properties:
        name: { $ref: "#/components/schemas/Widget/properties/name" }
        categoryId: { $ref: "#/components/schemas/Widget/properties/categoryId" }
        status: { $ref: "#/components/schemas/WidgetStatus" }
        availableFrom: { $ref: "#/components/schemas/Widget/properties/availableFrom" }
        assigneeEmail: { $ref: "#/components/schemas/Widget/properties/assigneeEmail" }
        price: { $ref: "#/components/schemas/Widget/properties/price" }
        description: { $ref: "#/components/schemas/Widget/properties/description" }
        tags: { $ref: "#/components/schemas/Widget/properties/tags" }
        inStock: { $ref: "#/components/schemas/Widget/properties/inStock" }
        extraCategoryIds: { $ref: "#/components/schemas/Widget/properties/extraCategoryIds" }
        checklist: { $ref: "#/components/schemas/Widget/properties/checklist" }
        pairings: { $ref: "#/components/schemas/Widget/properties/pairings" }

    WidgetUpdate:
      type: object
      description: >
        All fields optional — PATCH semantics. tags, when sent, replaces the
        whole set (send [] to clear it); so do extraCategoryIds, checklist
        and pairings (the last two also keep the order sent).
      properties:
        name: { $ref: "#/components/schemas/Widget/properties/name" }
        categoryId: { $ref: "#/components/schemas/Widget/properties/categoryId" }
        status: { $ref: "#/components/schemas/WidgetStatus" }
        availableFrom: { $ref: "#/components/schemas/Widget/properties/availableFrom" }
        assigneeEmail: { $ref: "#/components/schemas/Widget/properties/assigneeEmail" }
        price: { $ref: "#/components/schemas/Widget/properties/price" }
        description: { $ref: "#/components/schemas/Widget/properties/description" }
        tags: { $ref: "#/components/schemas/Widget/properties/tags" }
        inStock: { $ref: "#/components/schemas/Widget/properties/inStock" }
        extraCategoryIds: { $ref: "#/components/schemas/Widget/properties/extraCategoryIds" }
        checklist: { $ref: "#/components/schemas/Widget/properties/checklist" }
        pairings: { $ref: "#/components/schemas/Widget/properties/pairings" }

    WidgetChecklistState:
      type: string
      enum: [none, open, complete]
      description: >
        none: the checklist is empty. open: at least one item isn't done.
        complete: every item is done. Sorts in this order.

    ChecklistItem:
      type: object
      description: >
        One item of a widget's checklist. No id of its own: the list is
        read and written whole, in order.
      required: [text, done]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 300
          description: What to do. Surrounding spaces are trimmed; blank is a 422.
        done:
          type: boolean
          description: Ticked off.

    WidgetPairing:
      type: object
      description: >
        One item of a widget's pairings: a sub-record with a reference
        field. No id of its own: the list is read and written whole, in
        order. The same category may appear in more than one item.
      required: [categoryId, note]
      properties:
        categoryId:
          type: integer
          description: >
            The category paired with (WidgetCategory.id). Unknown is a 422
            at this item's path, never a foreign-key 500.
        note:
          type: string
          maxLength: 100
          description: >
            Optional text, "" when none. Surrounding spaces are trimmed.

    WidgetListResponse:
      type: object
      description: >
        Wire pagination shape — deliberately not Page<T>. The gateway
        computes page/pageSize from offset/limit; see src/api/gateway/.
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Widget" }
        total:
          type: integer
          minimum: 0

    PushPublicKey:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: string
          minLength: 1
          description: The P-256 public key, base64url (applicationServerKey).

    PushSubscriptionRequest:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          minLength: 1
          maxLength: 2048
          description: The push service's URL for this device.
        expirationTime:
          type: ["number", "null"]
          description: Milliseconds since the epoch, sent by some browsers, ignored.
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, minLength: 1, maxLength: 100 }
            auth: { type: string, minLength: 1, maxLength: 32 }

    PushSubscriptionCreated:
      type: object
      required: [id]
      properties:
        id: { type: integer }

    ClientErrorReport:
      type: object
      required: [source, type, message]
      properties:
        source:
          type: string
          enum: [route, window, unhandledrejection, query, mutation]
          description: Where the package caught it.
        type: { type: string, minLength: 1, maxLength: 200, description: "The error's type (TypeError, ServerError)." }
        message: { type: string, maxLength: 2000 }
        stack: { type: string, maxLength: 16000 }
        route:
          type: string
          maxLength: 300
          description: The route pattern (/items/:id), never the URL.
        method: { type: string, maxLength: 10, description: The HTTP method of a failed request. }
        status: { type: integer, minimum: 100, maximum: 599, description: The HTTP status of a failed request. }
        release: { type: string, maxLength: 100, description: The frontend build (its commit). }

    ValidationErrorBody:
      type: object
      description: FastAPI's default 422 shape (RequestValidationError).
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            required: [loc, msg, type]
            properties:
              loc:
                type: array
                items:
                  type: ["string", "integer"]
              msg: { type: string }
              type: { type: string }

    HTTPErrorBody:
      type: object
      description: FastAPI's default HTTPException shape.
      required: [detail]
      properties:
        detail: { type: string }

    Job:
      type: object
      required: [name, everySeconds, timeoutSeconds, running, lastRun]
      properties:
        name: { type: string, description: "The name the job was registered under, e.g. sync-feeds." }
        everySeconds: { type: integer, minimum: 0, description: "How long after a run the next one starts (before jitter)." }
        timeoutSeconds: { type: integer, minimum: 0, description: "A run still going after this fails." }
        running: { type: boolean, description: "Whether a run is in progress, in any process." }
        lastRun:
          oneOf:
            - $ref: "#/components/schemas/JobRun"
            - type: "null"
          description: The latest run that ran (ok or failed); null before the first.

    JobRun:
      type: object
      required: [trigger, startedAt, finishedAt, outcome, error, summary]
      properties:
        trigger: { type: string, enum: [schedule, manual] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        outcome: { type: string, enum: [ok, failed, skipped] }
        error:
          type: ["string", "null"]
          description: For a failed run, the error's type and message (or the timeout). null otherwise.
        summary:
          type: ["string", "null"]
          maxLength: 500
          description: What the job said it did ("12 new"), or why a run was skipped.

  responses:
    ValidationError:
      description: Validation failed on one or more fields.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationErrorBody" }
    NotFoundError:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HTTPErrorBody" }
    ConflictError:
      description: Conflicts with what is already happening (a job already running).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HTTPErrorBody" }
    UnauthorizedError:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HTTPErrorBody" }
    RateLimitedError:
      description: Too many failed attempts. Try again after Retry-After seconds.
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HTTPErrorBody" }
    SignInExpiredError:
      description: The pending sign-in is missing, expired or out of tries. Start again with POST /auth/login.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HTTPErrorBody" }
    ServerError:
      description: Unhandled server error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HTTPErrorBody" }
