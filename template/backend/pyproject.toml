[project]
name = "template-backend"
version = "0.1.0"
description = "FastAPI + SQLModel reference implementation of openapi.yaml. Conforms to a contract it does not own."
requires-python = ">=3.11"
dependencies = [
  # The foundation's auth and security layer (PyPI). In an app, pinned to
  # the release the app was made from (scripts/create-app.sh writes
  # ==X.Y.Z); upgrading it is docs/consuming.md's recipe. In the
  # ui-foundation repo it stays unpinned and is installed editable from
  # packages/backend-foundation in the same pip call as this project.
  "ui-foundation-backend",
  "fastapi==0.163.0",
  "sqlmodel[asyncio]==0.0.50",
  "alembic==1.20.1",
  "asyncpg==0.32.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "python-dotenv==1.2.4",
  "email-validator==2.4.0",
]

[project.optional-dependencies]
# Reminders through Web Push (foundation_backend.push): `pip install -e ".[push]"`, and
# PUSH_ENABLED=true. PyCA's library, for the P-256 and AES-GCM the
# standard library lacks; it brings cffi and pycparser.
push = [
  "cryptography==50.0.2",
]
dev = [
  # The push extra too, for the app's start-up test with push on.
  "cryptography==50.0.2",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "httpx==0.28.1",
  "pyyaml==6.0.3",
  "types-pyyaml==6.0.12.20261113",
  # ui-foundation-backend's recurrence reads dateutil (its own runtime
  # dependency); mypy strict needs its stubs.
  "types-python-dateutil==2.9.0.20261104",
  "aiosqlite==0.22.1",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
