[project]
name = "ui-foundation-backend"
version = "0.1.0"
description = "FastAPI + SQLModel implementation of openapi.yaml (Phase 8 — see docs/BUILD-PLAN.md). Conforms to a contract it does not own."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "sqlmodel==0.0.42",
  "alembic==1.20.0",
  "asyncpg==0.31.0",
  "uvicorn[standard]==0.53.0",
  "pydantic==2.13.5",
  "python-dotenv==1.2.3",
  "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "pyyaml==6.0.3",
  "types-pyyaml==6.0.12.20260906",
  "aiosqlite==0.22.1",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
