[project]
name = "ui-foundation-backend"
# The release workflow writes the release's version here, the same as
# @tristan2828/ui-foundation's (packages/ui-foundation/package.json).
version = "4.132.0"
description = "The auth and security layer shared by FastAPI + SQLModel backends built on ui-foundation: sessions, sign-in limits, TOTP, error reporting, deploy checks, AI chats' OAuth."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Each takes patch releases from the version CI tested, so an app can take
# a bug fix or a security fix with no foundation release; a new minor still
# waits for one. sqlmodel stays exact: its releases are 0.0.N, so every
# release is effectively a minor and a patch range would be the pin itself.
dependencies = [
  "fastapi>=0.163.0,<0.164",
  "sqlmodel[asyncio]==0.0.50",
  "pydantic>=2.14.3,<2.15",
  "python-dotenv>=1.2.4,<1.3",
  "email-validator>=2.4.0,<2.5",
  # Recurrence rules (foundation_backend.recurrence): its rrule, RFC 5545's
  # repeat rules, rather than date maths of our own.
  "python-dateutil>=2.9.0.post0,<2.10",
]

[project.urls]
Repository = "https://github.com/Tristan2828/ui-foundation"
Changelog = "https://github.com/Tristan2828/ui-foundation/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Web Push (foundation_backend.push): PyCA's library, for the P-256 and
# AES-GCM the standard library lacks. An app that sends reminders installs
# it (its own push extra, or ui-foundation-backend[push]).
push = [
  "cryptography>=50.0.2,<50.1",
]
dev = [
  "cryptography==50.0.2",
  "mypy==2.4.1",
  "types-python-dateutil==2.9.0.20261104",
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "httpx==0.28.1",
  "aiosqlite==0.22.1",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
# Reference copies for an app to take, not modules of this package
# (src/foundation_backend/migrations/README.md).
exclude = ["src/foundation_backend/migrations/"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foundation_backend = ["py.typed", "migrations/*.py", "migrations/README.md"]
